<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - ETG Asistencia</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#9C27B0">
    <link rel="icon" type="image/png" href="icon-192x192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #9C27B0 0%, #7B1FA2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 28px; color: #333; margin-bottom: 10px; }
        .pin-display {
            background: linear-gradient(135deg, #9C27B0 0%, #7B1FA2 100%);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }
        .pin-label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .pin-code {
            font-size: 56px;
            font-weight: bold;
            letter-spacing: 8px;
            font-family: 'Courier New', monospace;
            margin: 15px 0;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .timer-info {
            font-size: 12px;
            opacity: 0.9;
        }
        .btn {
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #9C27B0 0%, #7B1FA2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(156, 39, 176, 0.4);
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .info-box {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #2e7d32;
        }
        .event-info {
            background: #f3e5f5;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #6a1b9a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Código Dinámico</h1>
            <p>Control de Acceso ETG</p>
        </div>

        <div class="event-info">
            <strong>📍 Mantenimiento SY Querétaro</strong>
            24-25 de Agosto 2026
        </div>

        <div class="pin-display">
            <div class="pin-label">CÓDIGO VÁLIDO ACTUAL</div>
            <div class="pin-code" id="pinCode">----</div>
            <div class="timer-info">Cambia cada 30 segundos</div>
        </div>

        <div class="info-box">
            💡 <strong>Dale este código al crew:</strong> Lee el número en voz alta o muéstraselo en pantalla.
        </div>

        <button class="btn btn-primary" onclick="copiarCodigo()">📋 Copiar Código</button>
        <button class="btn btn-secondary" onclick="cerrarSesion()">🚪 Cerrar Sesión</button>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const adminLoggedIn = localStorage.getItem('adminLoggedIn');
            if (!adminLoggedIn) {
                window.location.href = 'index.html';
                return;
            }

            generarCodigo();
            setInterval(generarCodigo, 30000);
            console.log('✅ Admin cargado');
        });

        function generarCodigo() {
            const codigo = String(Math.floor(Math.random() * 10000)).padStart(4, '0');
            document.getElementById('pinCode').textContent = codigo;
            localStorage.setItem('codigoTOTP', codigo);
            console.log('✅ Código:', codigo);
        }

        function copiarCodigo() {
            const codigo = document.getElementById('pinCode').textContent;
            navigator.clipboard.writeText(codigo).then(() => {
                alert('✅ Código copiado: ' + codigo);
            });
        }

        function cerrarSesion() {
            localStorage.removeItem('adminLoggedIn');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
