<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - ETG Asistencia</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#9C27B0">
    <link rel="icon" type="image/png" href="icon-192x192.png">
    <script src="otpauth.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #9C27B0 0%, #7B1FA2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 28px; color: #333; margin-bottom: 10px; }
        .pin-display {
            background: linear-gradient(135deg, #9C27B0 0%, #7B1FA2 100%);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }
        .pin-label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .pin-code {
            font-size: 56px;
            font-weight: bold;
            letter-spacing: 8px;
            font-family: 'Courier New', monospace;
            margin: 15px 0;
        }
        .timer-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 15px;
        }
        .timer-fill {
            height: 100%;
            background: white;
            transition: width 1s linear;
        }
        .timer-info {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 10px;
        }
        .btn {
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #9C27B0 0%, #7B1FA2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(156, 39, 176, 0.4);
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .info-box {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #2e7d32;
        }
        .event-info {
            background: #f3e5f5;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #6a1b9a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Código Google Authenticator</h1>
            <p>Control de Acceso ETG</p>
        </div>

        <div class="event-info">
            <strong>📍 Mantenimiento SY Querétaro</strong>
            24-25 de Agosto 2026
        </div>

        <div class="pin-display">
            <div class="pin-label">CÓDIGO VÁLIDO ACTUAL</div>
            <div class="pin-code" id="pinCode">------</div>
            <div class="timer-bar">
                <div class="timer-fill" id="timerFill" style="width: 100%;"></div>
            </div>
            <div class="timer-info" id="timerText">30 segundos restantes</div>
        </div>

        <div class="info-box">
            💡 <strong>Dale este código al crew:</strong> Este es el MISMO código que ves en tu app Google Authenticator. Funciona en cualquier dispositivo.
        </div>

        <button class="btn btn-primary" onclick="copiarCodigo()">📋 Copiar Código</button>
        <button class="btn btn-secondary" onclick="cerrarSesion()">🚪 Cerrar Sesión</button>
    </div>

    <script>
        const SECRET_BASE32 = 'JBSWY3DPEBLW64TMMQ';
        let codigoActual = '';
        let totp = null;

        window.addEventListener('DOMContentLoaded', () => {
            const adminLoggedIn = localStorage.getItem('adminLoggedIn');
            if (!adminLoggedIn) {
                window.location.href = 'index.html';
                return;
            }

            totp = new OTPAuth.TOTP({
                issuer: 'ETG',
                label: 'Admin',
                algorithm: 'SHA1',
                digits: 6,
                period: 30,
                secret: OTPAuth.Secret.fromBase32(SECRET_BASE32)
            });

            actualizarCodigo();
            setInterval(actualizarCodigo, 1000);
            console.log('✅ Admin TOTP cargado con otpauth (compatible Google Authenticator)');
        });

        function actualizarCodigo() {
            try {
                codigoActual = totp.generate();
                document.getElementById('pinCode').textContent = codigoActual;

                const epoch = Math.floor(Date.now() / 1000);
                const segundosRestantes = 30 - (epoch % 30);
                const porcentaje = (segundosRestantes / 30) * 100;

                document.getElementById('timerFill').style.width = porcentaje + '%';
                document.getElementById('timerText').textContent = segundosRestantes + ' segundos restantes';
            } catch (error) {
                console.error('❌ Error generando TOTP:', error);
                document.getElementById('pinCode').textContent = 'ERROR';
            }
        }

        function copiarCodigo() {
            navigator.clipboard.writeText(codigoActual).then(() => {
                alert('✅ Código copiado: ' + codigoActual);
            });
        }

        function cerrarSesion() {
            localStorage.removeItem('adminLoggedIn');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
