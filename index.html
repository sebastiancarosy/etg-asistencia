<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETG Asistencia</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#9C27B0">
    <link rel="icon" type="image/png" href="icon-192x192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #9C27B0 0%, #7B1FA2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        .header {
            margin-bottom: 40px;
        }
        .logo {
            font-size: 64px;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 10px;
        }
        .header p {
            color: #666;
            font-size: 14px;
        }
        .steps {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
            justify-content: center;
        }
        .step-badge {
            background: #f0f0f0;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #9C27B0;
        }
        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }
        .btn-crew {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
        }
        .btn-crew:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }
        .admin-section {
            border-top: 2px solid #f0f0f0;
            padding-top: 30px;
            margin-top: 30px;
        }
        .admin-section h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 16px;
        }
        .btn-admin {
            background: linear-gradient(135deg, #9C27B0 0%, #7B1FA2 100%);
            color: white;
        }
        .btn-admin:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(156, 39, 176, 0.4);
        }
        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196F3;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #1565c0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🎵</div>
            <h1>ETG ASISTENCIA</h1>
            <p>Sistema de Auditoría con Google Authenticator</p>
        </div>

        <div class="info-box">
            ✅ Mantenimiento SY Querétaro - 24-25 de Agosto 2026
        </div>

        <div class="steps">
            <div class="step-badge">👥</div>
            <div class="step-badge">🔐</div>
            <div class="step-badge">📸</div>
            <div class="step-badge">✅</div>
        </div>

        <button class="btn btn-crew" onclick="irCrew()">👥 SOY CREW - Registrar Asistencia</button>

        <div class="admin-section">
            <h3>🔐 ADMINISTRADOR</h3>
            <button class="btn btn-admin" onclick="irAdmin()">🔐 Acceso Admin</button>
        </div>
    </div>

    <script>
        function irCrew() {
            window.location.href = 'crew.html';
        }

        function irAdmin() {
            const password = prompt('🔐 Ingresa la contraseña de Admin:');
            if (password === 'Seb@sti@nCar0YATRA.2026!') {
                localStorage.setItem('adminLoggedIn', 'true');
                window.location.href = 'admin.html';
            } else {
                alert('❌ Contraseña incorrecta');
            }
        }

        console.log('✅ Index cargado');
    </script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./service-worker.js")
                    .then(reg => console.log("✅ Service Worker registrado:", reg.scope))
                    .catch(err => console.error("❌ Error registrando Service Worker:", err));
            });
        }
    </script>
</body>
</html>
