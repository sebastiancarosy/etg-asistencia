<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ETG Asistencia</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#9C27B0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #9C27B0 0%, #7B1FA2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border-left: 4px solid #9C27B0;
        }
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #9C27B0;
            margin-bottom: 10px;
        }
        .stat-label {
            color: #666;
            font-size: 14px;
        }
        .links {
            background: #f3e5f5;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .link-item {
            margin-bottom: 10px;
        }
        .link-item a {
            color: #9C27B0;
            text-decoration: none;
            font-weight: 600;
        }
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #9C27B0 0%, #7B1FA2 100%);
            color: white;
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(156, 39, 176, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Dashboard - ETG Asistencia</h1>
            <p>Querétaro 24-25 de Agosto 2026</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="statPresentes">0</div>
                <div class="stat-label">👥 Presentes Hoy</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statRegistros">0</div>
                <div class="stat-label">📝 Total Registros</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statValidados">0</div>
                <div class="stat-label">✅ Códigos Validados</div>
            </div>
        </div>

        <div class="links">
            <h3 style="margin-bottom: 15px; color: #333;">🔗 Enlaces útiles:</h3>
            <div class="link-item">
                📊 <a href="#" onclick="abrirSheet()">Ver Google Sheet</a>
            </div>
            <div class="link-item">
                📁 <a href="#" onclick="abrirCarpeta()">Ver Carpeta de Fotos</a>
            </div>
        </div>

        <button class="btn" onclick="volverAdmin()">← Volver al Panel Admin</button>
    </div>

    <script src="google-config.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const adminLoggedIn = localStorage.getItem('adminLoggedIn');
            if (!adminLoggedIn) {
                window.location.href = 'index.html';
                return;
            }

            actualizarEstadisticas();
            console.log('✅ Dashboard cargado');
        });

        function actualizarEstadisticas() {
            try {
                const registros = JSON.parse(localStorage.getItem('registros_etg') || '[]');
                const hoy = new Date().toISOString().split('T')[0];
                
                const registrosHoy = registros.filter(r => r.fecha === hoy);
                const personas = new Set(registrosHoy.map(r => r.nombre)).size;
                const validados = registrosHoy.filter(r => r.pinValido).length;

                document.getElementById('statPresentes').textContent = personas;
                document.getElementById('statRegistros').textContent = registrosHoy.length;
                document.getElementById('statValidados').textContent = validados;

                console.log('📊 Estadísticas:', { personas, registros: registrosHoy.length, validados });
            } catch (error) {
                console.error('Error actualizando estadísticas:', error);
            }
        }

        function abrirSheet() {
            if (typeof GOOGLE_CONFIG !== 'undefined' && GOOGLE_CONFIG.SHEET_URL) {
                window.open(GOOGLE_CONFIG.SHEET_URL, '_blank');
            } else {
                alert('Google Sheet no configurado');
            }
        }

        function abrirCarpeta() {
            if (typeof GOOGLE_CONFIG !== 'undefined' && GOOGLE_CONFIG.FOLDER_URL) {
                window.open(GOOGLE_CONFIG.FOLDER_URL, '_blank');
            } else {
                alert('Carpeta de Google Drive no configurada');
            }
        }

        function volverAdmin() {
            window.location.href = 'admin.html';
        }
    </script>
</body>
</html>
